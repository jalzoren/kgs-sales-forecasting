services:
  # ================================
  # Backend (Express JS)
  # ================================
  - type: web
    name: express-backend
    env: node
    rootDir: backend
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: starter
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_API
        fromService:
          name: fastapi-ml-service
          type: web
          property: url
      - key: CORS_ORIGIN
        fromService:
          name: react-frontend
          type: static_site
          property: url
      # DB Variables for Supabase
      - key: DB_HOST
        value: db.ismmhblktrfumijtynxx.supabase.co
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        value: postgres
      - key: DB_PASS
        value: BCFsalesPCym6D9NDKJR3MHs
      - key: DB_NAME
        value: postgres
      # Session & Email
      - key: SESSION_SECRET
        value: superSecretKey123!
      - key: EMAIL_USER
        value: salesforecastingbcf@gmail.com
      - key: EMAIL_PASS
        value: aaiz ckgx rtqc buck

    disk:
      name: backend-storage
      mountPath: /opt/render/project/src/files
      sizeGB: 5

  # ================================
  # ML Service (Python FastAPI)
  # ================================
  - type: web
    name: fastapi-ml-service
    env: python
    rootDir: ml-service
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn main_app:app --host 0.0.0.0 --port 8000"
    plan: starter

  # ================================
  # Frontend (React Vite)
  # ================================
  - type: static_site
    name: react-frontend
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    publishPath: "dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          name: express-backend
          type: web
          property: url
      - key: VITE_PYTHON_URL
        fromService:
          name: fastapi-ml-service
          type: web
          property: url
